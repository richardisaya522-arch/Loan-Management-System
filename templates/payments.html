{% extends "base.html" %}
{% block content %}
<h3 class="mb-3">Malipo yote</h3>
<div class="card p-3">
  {% if rows %}<div class="table-responsive"><table class="table table-hover align-middle mb-0">
    <thead><tr><th>Risiti</th><th>Tarehe</th><th>Mteja</th><th>Mkopo</th><th>Kiasi</th><th>Njia</th><th></th></tr></thead>
    {% for p in rows %}<tr><td>RCP-{{ '%05d' % p.id }}</td><td>{{ p.paid_on }}</td><td>{{ p.name }}</td>
      <td><a href="{{ url_for('loan', lid=p.loan_id) }}">#{{ p.loan_id }}</a></td><td>{{ p.amount|tzs }}</td><td>{{ p.method }}</td>
      <td class="text-nowrap">
        <a href="{{ url_for('receipt', pid=p.id) }}" target="_blank" title="Risiti"><i class="bi bi-printer"></i></a>
        <a href="{{ url_for('payment_edit', pid=p.id) }}" class="ms-2 text-decoration-none" title="Rekebisha"><i class="bi bi-pencil-square"></i></a>
        <form method="post" action="{{ url_for('payment_delete', pid=p.id) }}" class="d-inline"
              onsubmit="return confirm('Futa malipo RCP-{{ '%05d' % p.id }}? Haiwezi kurudishwa.');">
          <input type="hidden" name="csrf" value="{{ csrf() }}">
          <button class="btn btn-link btn-sm p-0 ms-2 text-danger align-baseline" title="Futa"><i class="bi bi-trash"></i></button>
        </form>
      </td></tr>{% endfor %}
  </table></div>{% else %}<div class="text-center text-muted py-4"><i class="bi bi-receipt fs-1"></i><br>Hakuna malipo bado.</div>{% endif %}
</div>
{% endblock %}
